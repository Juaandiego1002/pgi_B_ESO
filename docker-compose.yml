name: retornos-y-amarres

services:
  # SQLite no tiene servidor propio: este servicio inicializa el fichero en el
  # volumen compartido y permanece vivo para exponer un healthcheck real.
  db:
    build:
      context: .
      dockerfile: Dockerfile
      target: db
    image: retornos-amarres-db:local
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:../db/custom.db}
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      - db-data:/app/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck-db.mjs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: retornos-amarres-web:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-file:../db/custom.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio; copia .env.example a .env}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - db-data:/app/db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/services').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:

networks:
  internal:
    driver: bridge
